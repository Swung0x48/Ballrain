[project]
name = "ballrain"
version = "0.1.0"
description = "A reinforcement learning environment for the game Ballance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium==1.2.1",
    "stable-baselines3==2.7.0",
    "pywin32==311; sys_platform == 'win32'",
    "numpy>=2.2.6",
    "torch>=2.14.1",
    "tensorboard>=2.21.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
