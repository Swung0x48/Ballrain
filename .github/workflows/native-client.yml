# The native volunteer client (docs/native-client.md section 9): the Windows build with the self test and the golden
# replays on ballrain.fakegame's synthetic level (no game files, no engine in CI), and build checks on Linux / macOS.
# The real-level goldens, task_diff and e2e_pool need the game and stay local (the pre-release checks).
name: native client

on:
  push:
    paths: ["native/**", "ballrain/**", "tools/native/**", ".github/workflows/native-client.yml"]
  pull_request:
    paths: ["native/**", "ballrain/**", "tools/native/**", ".github/workflows/native-client.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages for the golden recordings
        run: python -m pip install "numpy>=2.2.6" "gymnasium==1.2.1" "pywin32==311"
      - name: Build (MSVC x64, static runtime)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          set "VCVARS=%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          call native\build_win.cmd Release
      - name: Self test
        run: build\native-Release\nc_selftest.exe
      - name: Golden replays (fakegame)
        run: python tools/native/ci_goldens.py --nc-golden build/native-Release/nc_golden.exe --out ci-goldens
      - name: TUI renders
        shell: bash
        run: build/native-Release/BallrainCoordinator.exe --data-dir ci-tui --snapshot setup | grep -q "Ballance"
      - uses: actions/upload-artifact@v4
        with:
          name: ballrain-native-windows-x64-dev
          path: |
            build/native-Release/BallrainCoordinator.exe
            build/native-Release/ballrain_coordinator.exe
          retention-days: 14

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev
      - name: Build
        run: cmake --preset linux-x64 -S native && cmake --build build/native-linux-x64
      - name: Self test
        run: build/native-linux-x64/nc_selftest

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Toolchain
        run: brew install ninja
      - name: Build
        run: cmake --preset macos-arm64 -S native && cmake --build build/native-macos-arm64
      - name: Self test
        run: build/native-macos-arm64/nc_selftest
